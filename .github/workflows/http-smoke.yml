name: FastAPI HTTP smoke tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install httpx
      - name: Exercise real HTTP endpoints with TestClient
        run: python -m unittest discover -s tests -p 'test_http_smoke.py' -v
