name: Hotel ML regression and data validation tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install declared project requirements
        run: python -m pip install -r requirements.txt
      - name: Run model and dataset contract tests
        run: |
          mkdir -p artifacts
          python -m unittest discover -s tests -p 'test_prediction.py' -v 2>&1 | tee artifacts/model-tests.log
          test ${PIPESTATUS[0]} -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotel-model-tests-py311
          path: artifacts/model-tests.log
